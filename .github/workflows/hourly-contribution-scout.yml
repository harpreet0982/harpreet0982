name: Hourly contribution issue scout

on:
  schedule:
    # Offset from the start of the hour to reduce schedule congestion.
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hourly-contribution-issue-scout
  cancel-in-progress: false

jobs:
  find-issues:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the workflow repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Find recent beginner-friendly issues
        run: >-
          python .github/scripts/github_contribution_scout.py
          --top 20 --output github-contribution-queue.csv

      - name: Save the queue as a downloadable artifact
        if: ${{ hashFiles('github-contribution-queue.csv') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: contribution-issue-queue-${{ github.run_number }}
          path: github-contribution-queue.csv
          if-no-files-found: error
          retention-days: 7
